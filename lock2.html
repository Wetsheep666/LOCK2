<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#130d15">
  <title>第二關｜文字密碼鎖</title>
  <style>
    :root { color-scheme:dark; --text:#fff5f5; --muted:#bdabb8; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; min-height:100svh; padding:30px 16px; display:grid;place-items:center;color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif; overflow-x:hidden; background:radial-gradient(ellipse at 50% -10%,rgba(144,24,49,.35),transparent 46%),radial-gradient(ellipse at 89% 96%,rgba(72,21,39,.5),transparent 47%),#100c13; }
    body::before {content:"";position:fixed;inset:0;pointer-events:none;opacity:.23;background:repeating-linear-gradient(90deg,transparent 0 79px,rgba(255,255,255,.035) 80px),repeating-linear-gradient(0deg,transparent 0 79px,rgba(255,255,255,.035) 80px);}
    .wrap {width:min(100%,570px);position:relative;z-index:1;}
    .topline {display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 9px 19px;font-size:11px;letter-spacing:.17em;color:#c39fa9;font-weight:850;}
    .topline a {color:#c39fa9;text-decoration:none;letter-spacing:.04em;} .topline a:hover{text-decoration:underline;}
    .card {position:relative;overflow:visible;border:1px solid rgba(242,137,161,.22);border-radius:26px;background:linear-gradient(150deg,#2c1823 0%,#1b111c 45%,#160f19 100%);box-shadow:0 30px 100px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.06);padding:clamp(25px,6vw,46px);}
    .card::before {content:"";position:absolute;top:0;left:13%;right:13%;height:1px;background:linear-gradient(90deg,transparent,#c75a71,transparent);}
    .step {display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(247,125,150,.25);border-radius:40px;padding:8px 13px;color:#ffadbd;background:rgba(193,55,85,.13);font-size:11px;font-weight:850;letter-spacing:.16em;}
    h1 {font-size:clamp(30px,6vw,46px);letter-spacing:-.035em;margin:22px 0 10px;line-height:1.2;}
    .subtitle {font-size:14px;line-height:1.9;color:var(--muted);margin:0 0 30px;}
    .entry-wrap {position:relative;margin-bottom:25px;isolation:isolate;}
    .entry {height:93px;width:100%;border:1px solid #7c4053;border-bottom:3px solid #c65a71;border-radius:16px;background:#160e18;outline:0;text-align:center;letter-spacing:.38em;padding:0 0 0 .38em;color:#ffe5ea;font-size:clamp(25px,6vw,36px);font-weight:900;text-transform:uppercase;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;transition:box-shadow .2s,border-color .2s,background .2s;}
    .entry::placeholder {color:#59404b;letter-spacing:.23em;}
    .entry:focus {border-color:#ff879f;box-shadow:0 0 0 4px rgba(247,90,124,.13),0 15px 45px rgba(174,37,64,.1);}
    .entry-wrap.wrong {animation:shake .49s cubic-bezier(.36,.07,.19,.97);}
    .entry-wrap.wrong .entry {border-color:#ff365e;box-shadow:0 0 0 4px rgba(232,33,70,.1);}
    @keyframes shake {0%,100%{transform:translateX(0)} 18%,54%{transform:translateX(-11px)} 36%,72%{transform:translateX(11px)}}
    .action {display:block;width:100%;border:0;border-radius:13px;padding:17px 20px;color:#fff;font-family:inherit;font-size:15px;font-weight:850;letter-spacing:.09em;background:linear-gradient(110deg,#ae304f,#df5564);box-shadow:0 13px 30px rgba(160,26,59,.23);cursor:pointer;transition:transform .15s,filter .15s;}
    .action:hover {transform:translateY(-2px);filter:brightness(1.1);} .action:active{transform:scale(.98)} .action:focus-visible{outline:3px solid #ffe2e9;outline-offset:4px;}
    .status {font-size:13px;font-weight:800;letter-spacing:.04em;color:#a88c9c;text-align:center;min-height:22px;margin:18px 0 0;}
    .status.error {color:#ff6e89;} .status.ok {color:#f5a9b5;}
    .footer {text-align:center;font-size:11px;letter-spacing:.12em;color:#8b6e80;margin:20px 0 0;}
    .bleeding .entry {border-color:#b51e3d;box-shadow:0 0 25px rgba(209,21,55,.25),inset 0 -10px 18px rgba(115,4,23,.3);color:#ffbccb;animation:glowRed .35s alternate 4;}
    @keyframes glowRed {from {box-shadow:0 0 5px rgba(209,21,55,.1)} to {box-shadow:0 0 38px rgba(209,21,55,.6)}}
    .success-pop {position:absolute;z-index:8;left:50%;top:-20px;white-space:nowrap;transform:translateX(-50%);padding:10px 17px;border:1px solid rgba(255,160,179,.66);border-radius:999px;background:#662237;color:#fff2f5;font-size:14px;font-weight:900;box-shadow:0 8px 26px rgba(130,11,35,.45);animation:successBubble .5s both;}
    @keyframes successBubble {from {opacity:0;translate:0 16px;scale:.8} to {opacity:1;translate:0 0;scale:1}}
    .blood-line {position:absolute;left:8%;right:8%;bottom:0;height:6px;border-radius:10px;background:#b30930;box-shadow:0 2px 16px #c10b30;opacity:0;transform:scaleX(.05);transition:transform .55s,opacity .2s;pointer-events:none;z-index:4;}
    .bleeding .blood-line {opacity:1;transform:scaleX(1);}
    .blood-drop {position:absolute;z-index:3;top:calc(100% - 4px);left:var(--left);width:var(--w);height:0;background:linear-gradient(90deg,#74051d,#b60830 58%,#dc1741);border-radius:0 0 100px 100px;opacity:0;pointer-events:none;}
    .bleeding .blood-drop {animation:drip var(--duration) ease-in var(--delay) forwards;}
    @keyframes drip {0%{height:0;opacity:1} 55%{height:var(--height);opacity:1;transform:translateY(0)} 85%{height:var(--height);opacity:1;transform:translateY(0)} 100%{height:var(--height);opacity:0;transform:translateY(95px)}}
    .teardrop {position:absolute;left:var(--left);top:calc(100% + 15px);width:var(--s);height:var(--s);border-radius:70% 0 65% 65%;background:#c20a32;opacity:0;pointer-events:none;transform:rotate(-45deg);z-index:3;}
    .bleeding .teardrop {animation:fall 1.15s ease-in var(--delay) forwards;}
    @keyframes fall {0%{opacity:0;translate:0 0} 20%{opacity:1} 100%{opacity:0;translate:0 160px}}
    .success-view {opacity:0;transform:translateY(15px);transition:opacity .65s,transform .65s;}
    .success-view.show {opacity:1;transform:none;}
    .success-view h1 {margin-top:19px;} .success-view .subtitle{margin-bottom:20px;}
    .checkmark {width:66px;height:66px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,140,162,.42);background:rgba(227,55,91,.12);color:#ff9db4;font-size:32px;animation:pop .65s backwards;}
    @keyframes pop {from{opacity:0;transform:scale(.3) rotate(-30deg)} 75%{transform:scale(1.12)} to{opacity:1;transform:scale(1)}}
    .hat-scene {position:relative;min-height:302px;display:grid;place-items:center;overflow:hidden;border:1px solid rgba(140,158,240,.22);border-radius:18px;background:radial-gradient(ellipse at 50% 60%,rgba(57,102,213,.22),transparent 65%),linear-gradient(180deg,#111b32,#0c1222);}
    .hat-scene::before {content:"";position:absolute;inset:0;opacity:.45;background-image:radial-gradient(#6591ff 1px,transparent 1px);background-size:24px 24px;mask-image:linear-gradient(transparent,black,transparent);}
    .hat {width:min(96%,445px);height:auto;z-index:1;filter:drop-shadow(0 20px 23px rgba(0,0,0,.45));transform:translateY(34px) scale(.9) rotate(-7deg);opacity:0;transition:transform 1.1s cubic-bezier(.12,.75,.24,1.22),opacity .8s;}
    .show-hat .hat {opacity:1;transform:translateY(0) scale(1) rotate(0deg);animation:float 4s ease-in-out 1.2s infinite;}
    @keyframes float {0%,100%{translate:0 0}50%{translate:0 -7px}}
    .hat-caption {position:absolute;z-index:2;bottom:18px;left:20px;right:20px;text-align:center;color:#b2c9ff;font-size:11px;font-weight:900;letter-spacing:.22em;opacity:0;transform:translateY(8px);transition:opacity .65s .6s,transform .65s .6s;}
    .show-hat .hat-caption {opacity:1;transform:none;}
    .note {color:#b7aac4;font-size:13px;text-align:center;line-height:1.85;margin:17px 0 0;}
    .done {display:inline-block;font-size:11px;letter-spacing:.2em;font-weight:900;color:#94b8ff;border:1px solid #314b7e;background:#111d35;border-radius:99px;padding:9px 13px;}
    @media (prefers-reduced-motion:reduce) {*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topline"><span>THE WORD LOCK</span><a href="index.html" aria-label="返回第一關">← 返回第一關</a></div>
    <section class="card" aria-label="第二關文字密碼鎖">
      <div id="lockPanel">
        <span class="step">◆　LEVEL 02 / 02</span>
        <h1>文字密碼鎖</h1>
        <p class="subtitle">輸入五個英文字母，開啟最後一道鎖。<br>不分大小寫，但順序必須完全正確。</p>
        <form id="wordForm" autocomplete="off" novalidate>
          <div class="entry-wrap" id="entryWrap">
            <input class="entry" id="wordInput" type="text" inputmode="text" maxlength="5" placeholder="· · · · ·" aria-label="五位英文字母密碼" autocomplete="off" spellcheck="false" autocapitalize="characters" pattern="[A-Za-z]{5}" required>
            <span class="success-pop" id="successPop" hidden>✓ 輸入正確！</span>
            <div class="blood-line" aria-hidden="true"></div>
            <span class="blood-drop" style="--left:8%;--w:15px;--height:83px;--delay:.15s;--duration:1.65s"></span>
            <span class="blood-drop" style="--left:25%;--w:9px;--height:50px;--delay:.42s;--duration:1.7s"></span>
            <span class="blood-drop" style="--left:42%;--w:18px;--height:104px;--delay:.25s;--duration:1.65s"></span>
            <span class="blood-drop" style="--left:66%;--w:12px;--height:73px;--delay:.62s;--duration:1.75s"></span>
            <span class="blood-drop" style="--left:87%;--w:16px;--height:94px;--delay:.35s;--duration:1.6s"></span>
            <span class="teardrop" style="--left:12%;--s:14px;--delay:.92s"></span>
            <span class="teardrop" style="--left:47%;--s:19px;--delay:1.22s"></span>
            <span class="teardrop" style="--left:72%;--s:12px;--delay:1.04s"></span>
          </div>
          <button class="action" type="submit">驗證文字密碼　→</button>
        </form>
        <p id="status" class="status" role="status" aria-live="polite">等待輸入密碼…</p>
      </div>
      <div class="success-view" id="successView" hidden>
        <div class="checkmark" aria-hidden="true">✓</div>
        <span class="step" style="margin-top:18px">✓　LEVEL 02 CLEARED</span>
        <h1>輸入正確！</h1>
        <p class="subtitle">最後一道鎖已解除。你的答案在這裡：</p>
        <div class="hat-scene" id="hatScene">
          <svg class="hat" viewBox="0 0 490 325" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一頂沒有任何圖案或標誌的純藍色棒球帽">
            <defs>
              <linearGradient id="crownBlue" x1=".12" y1=".05" x2=".75" y2="1"><stop offset="0" stop-color="#5ba6ff"/><stop offset=".35" stop-color="#2278ed"/><stop offset=".72" stop-color="#1152bb"/><stop offset="1" stop-color="#0b3691"/></linearGradient>
              <linearGradient id="frontBlue" x1=".1" y1="0" x2=".95" y2="1"><stop stop-color="#358ffb"/><stop offset=".52" stop-color="#135bd1"/><stop offset="1" stop-color="#0c3a9e"/></linearGradient>
              <linearGradient id="brimBlue" x1="0" y1="0" x2=".75" y2="1"><stop stop-color="#2472e6"/><stop offset=".55" stop-color="#1052ba"/><stop offset="1" stop-color="#082c78"/></linearGradient>
              <linearGradient id="shadowBlue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0a348b"/><stop offset="1" stop-color="#1350af"/></linearGradient>
              <filter id="hatShadow" x="-30%" y="-30%" width="170%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
            </defs>
            <ellipse cx="264" cy="274" rx="182" ry="20" fill="#091d48" opacity=".62" filter="url(#hatShadow)"/>
            <path d="M96 197 C86 146 100 96 137 69 C174 39 229 40 263 46 C317 56 356 91 375 147 C386 178 383 208 365 230 C279 258 181 241 117 219 Z" fill="url(#crownBlue)" stroke="#0b3c94" stroke-width="4"/>
            <path d="M263 46 C241 82 232 149 245 227" stroke="#08398e" stroke-opacity=".66" stroke-width="3" fill="none"/>
            <path d="M263 47 C290 86 309 146 303 232" stroke="#77b7ff" stroke-opacity=".24" stroke-width="3" fill="none"/>
            <path d="M110 188 C126 122 169 78 229 60 C244 55 254 49 263 46 C242 99 236 164 245 227 C196 232 145 220 110 208 Z" fill="#1970df" opacity=".22"/>
            <path d="M264 46 C309 51 358 93 375 151 C387 180 382 209 365 230 C333 243 286 242 245 227 C231 162 243 94 264 46 Z" fill="url(#frontBlue)"/>
            <path d="M264 47 C245 92 234 159 245 226" fill="none" stroke="#06398e" stroke-width="4" opacity=".65"/>
            <path d="M265 48 C282 83 308 152 306 231" fill="none" stroke="#83baff" stroke-width="2" opacity=".35"/>
            <circle cx="265" cy="47" r="9" fill="#226fe1" stroke="#0b459e" stroke-width="3"/>
            <circle cx="265" cy="47" r="3.5" fill="#438df4"/>
            <path d="M116 212 C175 225 296 243 369 218 C396 219 426 230 447 246 C466 263 444 273 410 281 C346 297 216 289 139 269 C114 261 103 241 116 212 Z" fill="url(#brimBlue)" stroke="#0b3587" stroke-width="5"/>
            <path d="M117 218 C183 241 309 252 374 228 C401 232 420 242 435 252" fill="none" stroke="#73b8ff" stroke-width="4" opacity=".55" stroke-linecap="round"/>
            <path d="M139 264 C226 289 344 299 412 279" fill="none" stroke="#061f5b" stroke-width="5" opacity=".65" stroke-linecap="round"/>
            <path d="M111 203 C170 222 303 246 371 220" fill="none" stroke="url(#shadowBlue)" stroke-width="11" stroke-linecap="round"/>
            <path d="M115 198 C169 218 302 240 365 214" fill="none" stroke="#358af1" stroke-width="4" stroke-linecap="round" opacity=".72"/>
            <path d="M155 113 Q198 79 244 70" stroke="#95caff" stroke-width="5" opacity=".14" fill="none" stroke-linecap="round"/>
          </svg>
          <span class="hat-caption">YOUR FINAL CLUE</span>
        </div>
        <p class="note"><span class="done">MISSION COMPLETED</span></p>
      </div>
    </section>
    <p class="footer">ESCAPE ROOM　·　02 / 02</p>
  </main>
  <script>
    (() => {
      'use strict';
      const PASSWORD = 'BLEED';
      const form = document.getElementById('wordForm');
      const input = document.getElementById('wordInput');
      const wrap = document.getElementById('entryWrap');
      const status = document.getElementById('status');
      const successView = document.getElementById('successView');
      const hatScene = document.getElementById('hatScene');
      let unlocked = false;
      let timer;
      function statusMessage(message, state = '') { status.textContent = message; status.className = 'status ' + state; }
      function check() {
        if (unlocked) return;
        clearTimeout(timer);
        if (input.value.length !== 5 || input.value.toUpperCase() !== PASSWORD) {
          wrap.classList.remove('wrong'); void wrap.offsetWidth; wrap.classList.add('wrong');
          statusMessage(input.value.length !== 5 ? '請輸入完整的五個英文字母！' : '密碼錯誤！注意字母及順序。', 'error');
          input.focus(); input.select();
          return;
        }
        unlocked = true;
        statusMessage('✓ 輸入正確！', 'ok');
        input.readOnly = true;
        form.querySelector('button').disabled = true;
        form.querySelector('button').textContent = '✓ 輸入正確！';
        wrap.classList.remove('wrong');
        document.getElementById('successPop').hidden = false;
        setTimeout(() => wrap.classList.add('bleeding'), 540);
        setTimeout(() => {
          document.getElementById('lockPanel').hidden = true;
          successView.hidden = false;
          requestAnimationFrame(() => requestAnimationFrame(() => successView.classList.add('show')));
          setTimeout(() => hatScene.classList.add('show-hat'), 320);
        }, 3050);
      }
      input.addEventListener('input', () => {
        if (unlocked) return;
        input.value = input.value.replace(/[^a-z]/gi, '').slice(0, 5).toUpperCase();
        wrap.classList.remove('wrong');
        statusMessage(input.value.length ? `${input.value.length} / 5 字母已輸入` : '等待輸入密碼…');
        clearTimeout(timer);
        if (input.value.length === 5) timer = setTimeout(check, 450);
      });
      form.addEventListener('submit', event => { event.preventDefault(); check(); });
    })();
  </script>
</body>
</html>
